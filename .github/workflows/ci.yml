name: CI

on:
  push:
    branches: [master, main, "modernize-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync locked environment
        run: uv sync --locked --all-groups

      - name: Run the full suite (ZODB and PostgreSQL) with coverage
        # `make test` requires the PostgreSQL test container and enforces the
        # coverage threshold from pyproject.toml, so CI cannot silently drop
        # the RDBMS half of the suite.
        run: make test

      - name: Check Ruff lint
        run: uv run ruff check .

      - name: Check Ruff formatting
        run: uv run ruff format --check .

      - name: Run type checker
        run: uv run ty check zopyx

  frontend-lint:
    name: JavaScript lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Biome
        uses: biomejs/setup-biome@v2
        with:
          version: 2.5.14

      - name: Check JavaScript with Biome
        run: >-
          biome lint --error-on-warnings
          zopyx/plone/persistentlogger/browser/resources/persistent-log.js

      - name: Check JavaScript syntax
        run: node --check zopyx/plone/persistentlogger/browser/resources/persistent-log.js

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Audit locked dependencies
        run: |
          # The advisories describe the Plone 4/5 issue. Plone 6.2 is
          # locked to plone-app-contenttypes 5.0.1 without an indexed fix.
          uv audit --locked \
            --ignore GHSA-w6g9-xccc-347h

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: [quality, frontend-lint, dependency-audit]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Build and validate distributions
        run: |
          uv sync --locked --only-group release
          rm -rf dist build *.egg-info
          uv run --group release python -m build
          uv run --group release python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
