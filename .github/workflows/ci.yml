name: CI

on:
  push:
    branches: [master, main, "modernize-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.18"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync locked environment
        run: uv sync --locked --all-groups

      - name: Check Python metadata and lockfile
        run: make PYTHON=${{ matrix.python-version }} metadata-check

      - name: Run the full suite (ZODB and PostgreSQL) with coverage
        # `make test` requires the PostgreSQL test container and enforces the
        # coverage threshold from pyproject.toml, so CI cannot silently drop
        # the RDBMS half of the suite.
        run: make PYTHON=${{ matrix.python-version }} test

      - name: Check Ruff lint
        run: make PYTHON=${{ matrix.python-version }} lint

      - name: Check Ruff formatting
        run: make PYTHON=${{ matrix.python-version }} format-check

      - name: Run type checker
        run: make PYTHON=${{ matrix.python-version }} typecheck

  frontend-lint:
    name: JavaScript checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend tools and run checks
        run: make frontend-check

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.18"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Audit locked dependencies
        run: |
          # The advisories describe the Plone 4/5 issue. Plone 6.2 is
          # locked to plone-app-contenttypes 5.0.1 without an indexed fix.
          uv audit --locked \
            --ignore GHSA-w6g9-xccc-347h

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: [quality, frontend-lint, dependency-audit]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.18"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Build and validate distributions
        run: |
          uv sync --locked --all-groups
          make PYTHON=3.14 package-check
          make PYTHON=3.14 docs-reproducible-check

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
