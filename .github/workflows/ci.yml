name: CI

on:
  push:
    branches: [master, main, "modernize-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync locked environment
        run: uv sync --locked --all-groups

      - name: Run tests with branch coverage
        run: |
          uv run coverage run --branch -m zope.testrunner \
            --path . --package zopyx.plone.persistentlogger
          uv run coverage report --fail-under=90 -m

      - name: Check Ruff lint
        run: uv run ruff check .

      - name: Check Ruff formatting
        run: uv run ruff format --check .

      - name: Run type checker
        run: uv run ty check zopyx

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Audit locked dependencies
        run: uv audit --locked

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: [quality, dependency-audit]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Build and validate distributions
        run: |
          uv sync --locked --only-group release
          rm -rf dist build *.egg-info
          uv run --group release python -m build
          uv run --group release python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
