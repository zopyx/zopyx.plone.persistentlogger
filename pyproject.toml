[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zopyx.plone.persistentlogger"
version = "0.5.2"
description = "Persistent logging for Plone objects"
readme = {file = "docs/source/README.rst", content-type = "text/x-rst"}
requires-python = ">=3.14,<3.15"
license = "GPL-3.0-or-later"
authors = [
    {name = "Andreas Jung", email = "info@zopyx.com"},
]
keywords = ["Plone", "logging", "governance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Framework :: Plone",
    "Framework :: Plone :: 6.2",
    "Framework :: Zope2",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "plone.api",
    "loguru",
]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
ods = ["odfpy>=1.4"]

[project.entry-points."z3c.autoinclude.plugin"]
target = "plone"

[dependency-groups]
test = [
    "coverage[toml]>=7.6",
    "odfpy>=1.4",
    "openpyxl>=3.1",
    "plone.app.testing",
    "pytest>=8.0",
    "zope.testrunner",
]
lint = [
    "ruff>=0.14",
    "ty>=0.0.21",
]
release = [
    "build>=1.2",
    "twine>=5.1",
]
docs = [
    "Sphinx>=8.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["zopyx*"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.coverage.run]
branch = true
source = ["zopyx.plone.persistentlogger"]

[tool.ty.rules]
# Plone/Zope uses dynamic interfaces and persistent annotation mappings whose
# runtime APIs are not fully represented by third-party typing metadata.
unsupported-base = "ignore"
unresolved-import = "ignore"
unsupported-operator = "ignore"
invalid-assignment = "ignore"
invalid-argument-type = "ignore"
unresolved-attribute = "ignore"

[tool.coverage.report]
precision = 1
show_missing = true
fail_under = 98

[tool.uv]
default-groups = ["test", "lint"]
